const keys='ABCD';
const app=document.getElementById('app');
let state={category:null,type:null,idx:0,correct:0,wrong:0,total:0,answered:false,selected:new Set(),mode:'normal',wrongBook:[]};

// ===== 题目乱序 =====
function shuffle(arr){
  const a=[...arr];
  for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}
  return a;
}
// 页面加载时打乱每个小类的题目顺序
Object.keys(questions).forEach(k=>{questions[k]=shuffle(questions[k]);});

// ===== 错题本 localStorage =====
function loadWrongBook(){try{return JSON.parse(localStorage.getItem('wrongBook')||'[]');}catch(e){return[];}}
function saveWrongBook(book){localStorage.setItem('wrongBook',JSON.stringify(book));}
function addToWrongBook(q,userAns,src){
  let book=loadWrongBook();
  const entry={q:q.q,o:q.o,a:q.a,userAns:userAns,src:src,ts:Date.now()};
  // 避免重复添加同一道题
  const exists=book.some(e=>e.q===entry.q&&e.src===entry.src);
  if(!exists){book.push(entry);saveWrongBook(book);}
}
function removeFromWrongBook(idx){
  let book=loadWrongBook();book.splice(idx,1);saveWrongBook(book);
}
function clearWrongBook(){
  if(confirm('确定清空所有错题记录吗？')){saveWrongBook([]);renderWrongBook();}
}
function getWrongBookCount(){return loadWrongBook().length;}

function getCategories(){return[...new Set(Object.keys(questions).map(k=>k.split('_')[0]))];}
function getTypes(cat){return[...new Set(Object.keys(questions).filter(k=>k.startsWith(cat+'_')).map(k=>k.split('_')[1]))];}
function getKey(){return state.category+'_'+state.type;}
function getQuestions(){return questions[getKey()]||[];}

function renderHome(){
  state={category:null,type:null,idx:0,correct:0,wrong:0,total:0,answered:false,selected:new Set(),mode:'normal'};
  const cats=getCategories();
  const wrongCount=getWrongBookCount();
  let h='<div class="category-select"><div class="cat-btn active" onclick="selectCategory(\'全部\')">全部题库</div>';
  cats.forEach(c=>{h+=`<div class="cat-btn" onclick="selectCategory('${c}')">${c}</div>`;});
  h+=`<div class="wrong-book-btn" onclick="renderWrongBook()">📝 错题本 <span class="badge">${wrongCount}</span></div>`;
  h+='</div><div id="typeArea"></div><div id="quizArea"></div>';
  app.innerHTML=h;
  selectCategory('全部');
}

function selectCategory(cat){
  state.category=cat;
  document.querySelectorAll('.cat-btn').forEach(b=>{b.classList.toggle('active',b.textContent===cat||(cat==='全部'&&b.textContent==='全部题库'));});
  const typeArea=document.getElementById('typeArea');
  if(cat==='全部'){
    typeArea.innerHTML='<div class="type-select"><div class="type-btn active" onclick="selectType(\'全部\')">全部题型</div><div class="type-btn" onclick="selectType(\'单选\')">单选</div><div class="type-btn" onclick="selectType(\'多选\')">多选</div><div class="type-btn" onclick="selectType(\'判断\')">判断</div></div><div id="quizArea"></div>';
  }else{
    const types=getTypes(cat);
    let h='<div class="type-select"><div class="type-btn active" onclick="selectType(\'全部\')">全部题型</div>';
    types.forEach(t=>{h+=`<div class="type-btn" onclick="selectType('${t}')">${t}</div>`;});
    h+='</div><div id="quizArea"></div>';
    typeArea.innerHTML=h;
  }
  state.type='全部';
  startQuiz();
}

function selectType(t){
  state.type=t;
  document.querySelectorAll('.type-btn').forEach(b=>{b.classList.toggle('active',b.textContent===t);});
  startQuiz();
}

function getFilteredQuestions(){
  if(state.category==='全部'&&state.type==='全部'){
    let all=[];
    Object.values(questions).forEach(arr=>all=all.concat(arr));
    return all;
  }
  if(state.category==='全部'){
    let all=[];
    Object.keys(questions).filter(k=>k.endsWith('_'+state.type)).forEach(k=>all=all.concat(questions[k]));
    return all;
  }
  if(state.type==='全部'){
    let all=[];
    Object.keys(questions).filter(k=>k.startsWith(state.category+'_')).forEach(k=>all=all.concat(questions[k]));
    return all;
  }
  return questions[getKey()]||[];
}

function startQuiz(){
  state.idx=0;state.correct=0;state.wrong=0;state.answered=false;state.selected=new Set();
  renderQuestion();
}

function renderQuestion(){
  const qs=getFilteredQuestions();
  state.total=qs.length;
  if(state.idx>=qs.length){renderResult();return;}
  const q=qs[state.idx];
  const isMulti=q.a.length>1;
  const pct=((state.idx)/qs.length*100).toFixed(0);
  let h=`<div class="stats"><span>第 ${state.idx+1} / ${qs.length} 题</span><span>✅ ${state.correct} 正确 | ❌ ${state.wrong} 错误</span></div>`;
  h+=`<div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>`;
  h+=`<div class="question-card"><div class="q-number">${isMulti?'【多选题】':'【'+(q.o.length===2&&q.o[0]==='对'?'判断题':'单选题')+'】'} 第${state.idx+1}题</div>`;
  h+=`<div class="q-text">${escHtml(q.q)}</div>`;
  if(isMulti)h+=`<div class="multi-hint">💡 本题为多选题，选择所有正确选项后点击"确认"提交</div>`;
  h+=`<div class="options">`;
  q.o.forEach((opt,i)=>{
    h+=`<div class="option" id="opt${i}" onclick="selectOption(${i})"><div class="key">${keys[i]}</div><div>${escHtml(opt)}</div></div>`;
  });
  h+=`</div>`;
  if(isMulti)h+=`<button class="confirm-btn" id="confirmBtn" onclick="confirmMulti()">确认提交</button>`;
  h+=`<div id="resultArea"></div></div>`;
  app.querySelector('#quizArea').innerHTML=h;
  state.answered=false;
  state.selected=new Set();
}

function escHtml(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

function selectOption(i){
  if(state.answered)return;
  const qs=getFilteredQuestions();
  const q=qs[state.idx];
  const isMulti=q.a.length>1;
  if(isMulti){
    if(state.selected.has(i))state.selected.delete(i);else state.selected.add(i);
    document.querySelectorAll('.option').forEach((el,idx)=>{
      el.style.background=state.selected.has(idx)?'rgba(58,123,213,.2)':'';
      el.style.borderColor=state.selected.has(idx)?'#3a7bd5':'';
    });
  }else{
    checkAnswer([i]);
  }
}

function confirmMulti(){
  if(state.answered||state.selected.size===0)return;
  checkAnswer([...state.selected].sort());
}

function checkAnswer(selected){
  state.answered=true;
  const qs=getFilteredQuestions();
  const q=qs[state.idx];
  const correct=q.a;
  const isCorrect=selected.length===correct.length&&selected.every(v=>correct.includes(v));
  document.querySelectorAll('.option').forEach((el,i)=>{
    el.classList.add('disabled');
    if(correct.includes(i))el.classList.add('show-correct');
    if(selected.includes(i)&&!correct.includes(i))el.classList.add('wrong');
    if(selected.includes(i)&&correct.includes(i)){el.classList.remove('show-correct');el.classList.add('correct');}
  });
  const confirmBtn=document.getElementById('confirmBtn');
  if(confirmBtn)confirmBtn.style.display='none';
  const ra=document.getElementById('resultArea');
  if(isCorrect){
    state.correct++;
    ra.innerHTML=`<div class="result-msg right">✅ 回答正确！${state.idx<qs.length-1?'0.5秒后自动进入下一题...':''}</div>`;
    if(state.idx<qs.length-1)setTimeout(()=>{state.idx++;renderQuestion();},500);
  }else{
    state.wrong++;
    const ansStr=correct.map(i=>keys[i]).join('');
    // 记录错题
    const userAnsStr=selected.map(i=>keys[i]).join('');
    const src=state.mode==='wrongbook'?('错题本_'+(state.idx+1)):(getKey()+'_'+(state.idx+1));
    addToWrongBook(q,selected,src);
    ra.innerHTML=`<div class="result-msg fail">❌ 回答错误！正确答案是：<strong>${ansStr}</strong>（已记入错题本）</div><button class="next-btn" onclick="state.idx++;renderQuestion();">下一题 →</button>`;
  }
}

function renderResult(){
  const pct=state.total>0?(state.correct/state.total*100).toFixed(1):0;
  let emoji=pct>=90?'🏆':pct>=70?'👍':pct>=50?'💪':'📚';
  app.querySelector('#quizArea').innerHTML=`<div class="score-panel"><h2>${emoji} 练习完成！</h2><div class="score">${pct}分</div><p>共 ${state.total} 题</p><p>✅ 正确 ${state.correct} 题 | ❌ 错误 ${state.wrong} 题</p><button class="restart-btn" onclick="startQuiz()">再来一次</button><br><button class="restart-btn" style="margin-top:10px;background:linear-gradient(135deg,#6366f1,#8b5cf6)" onclick="renderHome()">返回选择</button></div>`;
  const pb=app.querySelector('.progress-bar');if(pb)pb.innerHTML='<div class="progress-fill" style="width:100%"></div>';
}

// ===== 错题复习模式 =====
function renderWrongBook(){
  state.mode='wrongbook';
  const book=loadWrongBook();
  const qa=document.getElementById('quizArea');
  const ta=document.getElementById('typeArea');
  if(ta)ta.innerHTML='';
  if(book.length===0){
    qa.innerHTML=`<div class="question-card"><div class="empty-wrong"><div class="icon">🎉</div><h2 style="color:#69f0ae;margin-bottom:10px">暂无错题</h2><p>太棒了！还没有记录任何错题。</p><br><button class="restart-btn" onclick="renderHome()">返回首页</button></div></div>`;
    return;
  }
  let h=`<div class="stats"><span>📝 错题本 共 ${book.length} 题</span><span><button class="clear-all-btn" onclick="clearWrongBook()">清空错题</button></span></div>`;
  h+=`<div class="wrong-list">`;
  book.forEach((item,idx)=>{
    const isJudge=item.o.length===2&&item.o[0]==='对';
    const typeLabel=isJudge?'判断题':(item.a.length>1?'多选题':'单选题');
    h+=`<div class="wrong-item"><div class="q-number">【${typeLabel}】来源：${escHtml(item.src)}</div>`;
    h+=`<div class="wq-text">${idx+1}. ${escHtml(item.q)}</div>`;
    h+=`<div class="wo-opts">`;
    item.o.forEach((opt,oi)=>{
      const isCorrectOpt=item.a.includes(oi);
      const isUserWrong=item.userAns.includes(oi)&&!isCorrectOpt;
      let cls=isCorrectOpt?'is-correct':(isUserWrong?'is-wrong':'neutral');
      h+=`<div class="wo-opt ${cls}"><div class="key">${keys[oi]}</div><div>${escHtml(opt)}</div></div>`;
    });
    h+=`</div>`;
    h+=`<div class="wrong-meta">`;
    h+=`<span>你的答案：<span class="your-ans">${item.userAns.map(i=>keys[i]).join('')}</span> | 正确答案：<span class="correct-ans">${item.a.map(i=>keys[i]).join('')}</span></span>`;
    h+=`<button class="remove-wrong" onclick="removeFromWrongBook(${idx});renderWrongBook();">✓ 已掌握</button>`;
    h+=`</div></div>`;
  });
  h+=`</div>`;
  h+=`<div style="text-align:center;margin-top:20px"><button class="restart-btn" onclick="renderHome()">返回首页</button></div>`;
  qa.innerHTML=h;
}

renderHome();
</script>
</body>
</html>
